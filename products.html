<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Products — Phoenixborne Oath</title>

  <meta name="description" content="Koleksi resmi Phoenixborne Oath. Metal Brand Indonesia dengan rilis terbatas dan filosofi kebangkitan." />

  <meta name="theme-color" content="#050507" />

<link rel="icon" href="/favicon.ico" sizes="any">

<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<link rel="apple-touch-icon" sizes="180x180" href="/icons/favicon-180.png">
  <link rel="canonical" href="https://phoenixborneoath.com/products.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    
    body{
background:#050505;
color:#e5e7eb;
font-family:'Inter',sans-serif;
line-height:1.9;
overflow-x:hidden;
}

    a {
      color: inherit;
      text-decoration: none;
    }

    .container{
width:min(1200px,100%);
margin:0 auto;
padding:80px 24px;
}
    h1{
font-family:'Cinzel',serif;
font-size:64px;
font-weight:700;
line-height:1.05;
letter-spacing:4px;
text-transform:uppercase;
color:#ffffff;
margin-bottom:18px;
}

    .sub{
font-size:18px;
line-height:1.8;
color:#d7d7d7;
margin-bottom:50px;
}
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.4rem;
    }

    .card {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      background: #020617;
      padding: 1rem;
      box-shadow: 0 16px 35px rgba(0,0,0,0.85);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 0.8rem;
    }

    .name{
font-size:16px;
letter-spacing:4px;
text-transform:uppercase;
margin-bottom:10px;
color:#ffffff;
}

    .price {
      font-size: 0.95rem;
      color: #f9fafb;
      margin-bottom: 0.6rem;
    }

    .note {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .back{
display:inline-block;
margin-top:60px;
font-size:14px;
letter-spacing:3px;
text-transform:uppercase;
border-bottom:1px solid rgba(255,255,255,.2);
padding-bottom:4px;
transition:border-color .3s,color .3s;
}

.back:hover{
color:#ffffff;
border-color:#ffffff;
}
    @media (max-width:768px){

.container{
width:100%;
padding:70px 22px;
}

h1{
font-size:clamp(38px,9vw,50px);
line-height:1.05;
letter-spacing:2px;
margin-bottom:15px;
}

.sub{
font-size:18px;
line-height:1.8;
margin-bottom:40px;
}

.grid{
grid-template-columns:1fr;
gap:24px;
}

.name{
font-size:15px;
letter-spacing:3px;
}

.back{
margin-top:50px;
font-size:13px;
letter-spacing:2px;
}

}
    
  </style>
</head>

<body>
  <main class="container">

    <h1>Products</h1>
    <p class="sub">Official release dari Phoenixborne Oath</p>

   <section class="grid" id="productsGrid">
     
    </section>

    <a href="/" class="back">← Kembali ke Homepage</a>

  </main>
  <script src="products-data.js"></script>
  <script>
  const products = PRODUCTS;
  const grid = document.getElementById("productsGrid");

  const formatRupiah = (value) =>
    new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(value);
    
     function sortProductsForDisplay(list) {
    return list.slice().sort((a, b) => {
      const getPriority = (p) => {
        const status = p.stockStatus.toLowerCase();
        if (status.includes("ready")) return 0;
        if (status.includes("low")) return 1;
        if (status.includes("sold")) return 2;
        return 3;
      };

      const priorityA = getPriority(a);
      const priorityB = getPriority(b);

      if (priorityA !== priorityB) {
        return priorityA - priorityB;
      }

      return b.id - a.id;
    });
  }

  function renderProductsPage() {
  grid.innerHTML = "";

  sortProductsForDisplay(products).forEach(p => {
      const card = document.createElement("article");
      card.className = "card";
      
      card.innerHTML = `
        <img 
        src="${p.cover}" 
        alt="${p.name}" 
        class="product-img"
        data-slug="${p.slug}"
       style="cursor:pointer"
      >
        <div class="name">${p.name}</div>
        <div class="price">
          ${p.price ? formatRupiah(p.price) : "—"}
        </div>
        <div class="note">
          ${p.category === "soldout" ? "Sold Out / Upcoming" : "Limited Drop"}
        </div>
      `;

      grid.appendChild(card);
    });
}

  renderProductsPage();

   grid.addEventListener("click", e => {
  const img = e.target.closest(".product-img");
  if (!img) return;

  const slug = img.dataset.slug;
  if (!slug) return;

  window.location.href = "index.html?product=" + slug;
});
</script>
</body>
</html>
