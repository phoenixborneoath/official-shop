<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Official Archive | Phoenixborne Oath</title>

    <link rel="icon" href="/favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        /* ==========================================================
   PHOENIXBORNE OATH
   OFFICIAL ARCHIVE
   FOUNDATION STYLES
========================================================== */

:root{

    --bg:#080808;
    --surface:#111111;
    --surface-hover:#171717;

    --border:#262626;
    --border-hover:#5d5d5d;

    --text:#F5F5F5;
    --text-soft:#9A9A9A;

    --accent:#D9D9D9;

    --radius:18px;

    --transition:.35s ease;

    --container:720px;

}

/* =========================
RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:var(--bg);

    color:var(--text);

    font-family:"Inter",sans-serif;

    line-height:1.7;

    overflow-x:hidden;

}

/* =========================
BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.05;

    background-image:
    radial-gradient(circle,#ffffff 1px,transparent 1px);

    background-size:24px 24px;

}

/* =========================
TYPOGRAPHY
========================= */

h1,
h2{

    font-family:"Cinzel",serif;

    font-weight:700;

    line-height:1.2;

}

h1{

    font-size:2rem;

    letter-spacing:1px;

}

h2{

    font-size:1.4rem;

}

p{

    color:var(--text-soft);

    font-size:.96rem;

}

a{

    color:inherit;

    text-decoration:none;

}

/* =========================
LAYOUT
========================= */

.archive{

    width:100%;

    max-width:var(--container);

    margin:auto;

    padding:28px 22px 70px;

}

.archive-header{

    width:100%;

    max-width:var(--container);

    margin:auto;

    padding:22px 22px 0;

}

.archive-footer{

    text-align:center;

    padding:40px 20px;

    border-top:1px solid var(--border);

}

.archive-footer p{

    font-size:.8rem;

    color:#7f7f7f;

}

      /* ==========================================================
   HERO
========================================================== */

.archive-back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#bdbdbd;
    font-size:.9rem;
    transition:.3s ease;
}

.archive-back:hover{
    color:#fff;
    transform:translateX(-4px);
}

.archive-hero{
    padding:50px 0 40px;
    border-bottom:1px solid var(--border);
    margin-bottom:30px;
}

.breadcrumb{
    display:inline-block;
    color:#7d7d7d;
    letter-spacing:3px;
    font-size:.75rem;
    text-transform:uppercase;
    margin-bottom:18px;
}

.archive-hero h1{
    font-size:2.2rem;
    margin-bottom:18px;
}

.archive-hero p{
    max-width:420px;
    color:#9b9b9b;
    font-size:1rem;
}

/* ==========================================================
   SEASON CARD
========================================================== */

.season-card{

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:26px;

    margin-bottom:20px;

    transition:var(--transition);

}

.season-card:hover{

    transform:translateY(-6px);

    border-color:var(--border-hover);

    background:var(--surface-hover);

    box-shadow:0 15px 35px rgba(255,255,255,.05);

}

.season-number{

    display:inline-block;

    font-size:.72rem;

    letter-spacing:4px;

    color:#888;

    margin-bottom:15px;

}

.season-card h2{

    margin-bottom:20px;

    color:#fff;

}

.status{

    display:inline-block;

    padding:8px 14px;

    border:1px solid #3d3d3d;

    border-radius:999px;

    font-size:.72rem;

    letter-spacing:2px;

    color:#b8b8b8;

    margin-bottom:24px;

}

.released{

    color:#d9d9d9;

    border-color:#666;

}

.season-button{

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-top:1px solid var(--border);

    padding-top:18px;

    font-weight:600;

    transition:var(--transition);

}

.season-button:hover{

    letter-spacing:1px;

    color:#fff;

}

.disabled{

    opacity:.55;

}

.disabled:hover{

    transform:none;

    box-shadow:none;

    border-color:var(--border);

    background:var(--surface);

}

/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:768px){

    .archive{

        padding:22px;

    }

    .archive-hero{

        padding-top:35px;

    }

    .archive-hero h1{

        font-size:1.9rem;

    }

}
    </style>

</head>

<body>

<header class="archive-header">

    <a href="/" class="archive-back">
        ← Back to Home
    </a>

</header>

<main class="archive">

    <!-- Hero -->

    <section class="archive-hero">

        <span class="breadcrumb">
            HOME / ARCHIVE
        </span>

        <h1>
            OFFICIAL ARCHIVE
        </h1>

        <p>
            Every collection begins with a Season.
            Select one to continue.
        </p>

    </section>

    <!-- Season I -->

    <section class="season-card">

        <span class="season-number">
            SEASON I
        </span>

        <h2>
            The Oath Before The Rise
        </h2>

        <span class="status released">
            RELEASED
        </span>

        <a href="/articles/season-1.html" class="season-button">
            Enter Season →
        </a>

    </section>

    <!-- Season II -->

    <section class="season-card disabled">

        <span class="season-number">
            SEASON II
        </span>

        <h2>
            Coming Soon
        </h2>

        <span class="status">
            IN DEVELOPMENT
        </span>

    </section>

    <!-- Season III -->

    <section class="season-card disabled">

        <span class="season-number">
            SEASON III
        </span>

        <h2>
            Coming Soon
        </h2>

        <span class="status">
            IN DEVELOPMENT
        </span>

    </section>

</main>

<footer class="archive-footer">

    <p>
        © 2026 Phoenixborne Oath. All Rights Reserved.
    </p>

</footer>

</body>

</html>
